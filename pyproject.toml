[project]
name = "olist-ecommerce"
version = "0.1.0"
description = "End-to-end e-commerce data analytics project using PostgreSQL, SQL, Python, Power BI, and Machine Learning."
authors = [
    {name = "Dyego Nery"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.1.0,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)"
]
